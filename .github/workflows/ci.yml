name: CI

on:
  push:
    branches: [nightly, dev-sync]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Skip ZK toolchain builds
  SKIP_GUEST_BUILD: "1"
  SP1_SKIP_PROGRAM_BUILD: "true"
  RISC0_SKIP_BUILD_KERNELS: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt

      - name: Enable full workspace
        run: cargo switcheroo disable

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy

      - name: Enable full workspace
        run: cargo switcheroo disable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::uninlined_format_args -A clippy::to_string_in_format_args -A deprecated -A clippy::too_many_arguments

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Enable full workspace
        run: cargo switcheroo disable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo nextest run --workspace --exclude sov-demo-rollup --exclude sov-celestia-adapter --exclude py_sovereign_web3
